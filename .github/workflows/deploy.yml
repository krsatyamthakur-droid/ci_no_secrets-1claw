name: deploy

# A CI pipeline that holds NO real secrets. The deploy credential lives in a
# 1Claw vault and is pulled at runtime. GitHub Secrets holds only one thing:
# ONECLAW_AGENT_API_KEY — a low-privilege bootstrap key that can do nothing but
# fetch the vault secrets this workflow is allowed to read.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: read # no id-token needed; auth is the scoped 1Claw agent key

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Claw vault
        id: vault
        uses: 1clawAI/1claw-action@v1
        with:
          api-key: ${{ secrets.ONECLAW_AGENT_API_KEY }}
          mask: "true"
          # ENV_NAME=<vault-id-or-name>/<secret-path>
          secrets: |
            DEPLOY_KEY=7d6d3a2f-875e-47cd-8915-3c24709492db/examples/hello

      - name: Deploy using the vault secret
        run: ./deploy.sh
        # DEPLOY_KEY is injected into the env by the step above and masked in logs.
