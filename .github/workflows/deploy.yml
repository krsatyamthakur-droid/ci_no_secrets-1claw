name: deploy

# A CI pipeline that holds NO real secrets. The deploy credential lives in a
# 1Claw vault and is pulled at runtime via the 1Claw SDK. GitHub Secrets holds
# only ONECLAW_AGENT_API_KEY — a low-privilege bootstrap key that can do nothing
# but read the vault secrets this agent is scoped to.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # run it manually from the Actions tab

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Load secret from 1Claw vault
        env:
          ONECLAW_AGENT_API_KEY: ${{ secrets.ONECLAW_AGENT_API_KEY }}
          ONECLAW_VAULT_ID: 7d6d3a2f-875e-47cd-8915-3c24709492db
          DEMO_SECRET_PATH: examples/hello
        run: node ci/fetch-secret.mjs

      - name: Deploy using the vault secret
        run: ./deploy.sh
        # DEPLOY_KEY was injected into the env by the step above and is masked in logs.
